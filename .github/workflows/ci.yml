name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the run of the first push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "28.3"
  REBAR3_VERSION: "3.24.0"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Compile
        run: make compile

      - name: Unit tests
        run: make test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      # The PLT depends on Erlang/OTP and on eta, and not on the source of
      # peace.
      - name: Cache the PLT
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build/*/rebar3_*_plt
          key: plt-${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('rebar.config') }}

      - name: Dialyzer
        run: make dialyzer

  simulation:
    name: Deterministic simulation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      # Each test runs in an Erlang node of its own with one scheduler
      # thread. The job runs one node for each processor of the runner.
      - name: Simulation suite
        run: dst/run.sh -j "$(nproc)"

      - name: Upload the output of the tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: dst-logs
          path: |
            _build/dst-logs/*.log
            _build/dst-logs/times*

  trace:
    name: Trace validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      # TLC checks each trace. The jar is in formal/vendor.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Trace validation
        run: make trace

  porcupine:
    name: Linearizability checking
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: dst/porcupine/go.mod
          cache-dependency-path: dst/porcupine/go.sum

      - name: Porcupine
        run: make porcupine
